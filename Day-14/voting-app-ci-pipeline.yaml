# Azure DevOps CI Pipeline for Voting App (Vote Service)
# Automates building Docker images, tagging with BuildId, pushing to ACR, and updating Kubernetes manifests

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - vote/*

resources:
  - repo: self

variables:
  # Replace with your Azure DevOps Docker Registry Service Connection name/ID
  dockerRegistryServiceConnection: 'acr-service-connection'
  # Name of your Azure Container Registry (e.g. myacr.azurecr.io)
  containerRegistry: 'abhishekazurecicd.azurecr.io'
  imageRepository: 'votingapp'
  dockerfilePath: '$(Build.SourcesDirectory)/vote/Dockerfile'
  tag: '$(Build.BuildId)'

# Agent pool: 'ubuntu-latest' for Microsoft-hosted agent or custom pool name for self-hosted
pool:
  vmImage: 'ubuntu-latest'

stages:
  # ==========================================
  # Stage 1: Build Docker Image
  # ==========================================
  - stage: Build
    displayName: 'Build Docker Image'
    jobs:
      - job: BuildJob
        displayName: 'Docker Build'
        steps:
          - task: Docker@2
            displayName: 'Build Vote container image'
            inputs:
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(imageRepository)'
              command: 'build'
              Dockerfile: '$(dockerfilePath)'
              tags: |
                $(tag)
                latest

  # ==========================================
  # Stage 2: Push Image to ACR
  # ==========================================
  - stage: Push
    displayName: 'Push to Azure Container Registry'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: PushJob
        displayName: 'Docker Push'
        steps:
          - task: Docker@2
            displayName: 'Push Vote container image to ACR'
            inputs:
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(imageRepository)'
              command: 'push'
              tags: |
                $(tag)
                latest

  # ==========================================
  # Stage 3: Update Kubernetes Manifests
  # ==========================================
  - stage: UpdateManifests
    displayName: 'Update Kubernetes Manifests'
    dependsOn: Push
    condition: succeeded()
    jobs:
      - job: UpdateManifestsJob
        displayName: 'Update Image Tag in K8s Manifest'
        steps:
          - script: |
              echo "Updating Kubernetes deployment manifests with new tag: $(tag)"
              sed -i 's|image:.*$(imageRepository):.*|image: $(containerRegistry)/$(imageRepository):$(tag)|g' k8s-specifications/vote-deployment.yaml || true
              echo "Manifest updated successfully."
            displayName: 'Update deployment YAML with new tag'
