apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - http:
        paths:
          # Frontend Web Storefront
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
          # API: Catalogue Service
          - path: /api/catalogue
            pathType: Prefix
            backend:
              service:
                name: catalogue
                port:
                  number: 8080
          # API: User Service
          - path: /api/user
            pathType: Prefix
            backend:
              service:
                name: user
                port:
                  number: 8080
          # API: Cart Service
          - path: /api/cart
            pathType: Prefix
            backend:
              service:
                name: cart
                port:
                  number: 8080
          # API: Payment Service
          - path: /api/payment
            pathType: Prefix
            backend:
              service:
                name: payment
                port:
                  number: 8080
